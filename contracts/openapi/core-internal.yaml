  /internal/tools/{tool_id}:invoke:
    post:
      operationId: invokeTool
      summary: Thực thi một tool chỉ-đọc theo capability token và ghi bản ghi bằng chứng `tool_calls`
      description: 'Xác thực bằng `Authorization: Bearer <capability_token>`.

        - Kiểm tra `tool_id` nằm trong `claims.tools` → ngoài danh sách trả `403 TOOL_NOT_GRANTED`.

        - Kiểm tra lại kill switch (`tenant`, `bot`, `tool`) ở **mỗi** lần gọi → đang bật trả `423 KILL_SWITCH_ACTIVE`.

        - Kiểm tra `claims.attempt` khớp lease đang giữ → sai trả `409 LEASE_LOST`.

        - `input` được kiểm tra theo `<ToolId>Input` trong `components.schemas`; sai schema trả `400 VALIDATION_FAILED`.

        - Nếu nguồn dữ liệu bên ngoài (`sim-world` / `gate`) lỗi hoặc timeout sau 3 s → vẫn trả `200`
        với `ToolResult.error != null` để bot ghi Finding vàng.'
      tags:
      - Tools
      security:
      - CapabilityBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ToolId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolInvokeRequest'
            examples:
              invoke_price_check:
                summary: Bot procurement gọi price_check cho dòng ly nhựa PP 500ml
                value:
                  input:
                    mappings:
                    - line_id: lin_01M880JA5YPYX80BJYVJNP4YM5
                      sku: CUP-PP500-1000
              invoke_tax_id_lookup:
                summary: Bot tax tra cứu trạng thái MST người bán
                value:
                  input:
                    tax_id: '0999010003'
      responses:
        '200':
          description: Kết quả thực thi tool bọc trong `ToolResult`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: ../schemas/tool-result.schema.json
              examples:
                price_check_shrinkflation_result:
                  summary: Kết quả price_check phát hiện thùng 800 cái vs 1.000 cái (+21,739130%)
                  value:
                    data:
                      items:
                      - line_id: lin_01M880JA5YPYX80BJYVJNP4YM5
                        sku: CUP-PP500-1000
                        contract_item_id: itm_01M88CSDFSBSMNDF8409DYVJBZ
                        unit_price_invoice: '648.148148'
                        unit_price_contract: '532.407407'
                        delta_pct: '21.739130'
                        pack_qty_contract: '1000.000000'
                        pack_qty_parsed: '800.000000'
                    provenance: trusted
                    evidence_ref: tcl_01M881V688YK0A46F0RNNJENR1
                    error: null
                upstream_timeout_error:
                  summary: Nguồn tra cứu bên ngoài quá thời gian 3 s (trả 200 kèm ToolResult.error)
                  value:
                    data: {}
                    provenance: trusted
                    evidence_ref: tcl_01M887W2N49Z4KDDKAGYHGVVQS
                    error:
                      code: UPSTREAM_TIMEOUT
                      detail: sim-world /einvoice/invoices timed out after 3.0s
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/CapabilityUnauthorized'
        '403':
          $ref: '#/components/responses/ToolNotGranted'
        '409':
          $ref: '#/components/responses/LeaseOrStateConflict'
        '423':
          $ref: '#/components/responses/Locked'
  /internal/webhooks/rails:
    post:
      operationId: receiveRailsWebhook
      summary: Nhận sự kiện webhook từ `sim-world` (`card.authorization_declined`, `transfer.settled`,
        `transfer.failed`)
      description: 'Xác thực bằng `X-Service-Key` của `sim-world`. Xử lý idempotent theo `event_id`.

        - `card.authorization_declined`: phát sự kiện `indicator.flagged` với `source = rail` (luồng F8).

        - `transfer.settled` / `transfer.failed`: chỉ ghi đối soát; trạng thái thanh toán chính thức do
        Payment Gate quyết định.'
      tags:
      - Webhooks
      security:
      - ServiceKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RailsWebhookRequest'
            examples:
              card_declined_wrong_merchant:
                summary: F8 — Thẻ ảo bị quẹt sai đơn vị chấp nhận thẻ
                value:
                  event_id: evt_01M8867BQMQG52GZYDE75JHF2V
                  type: card.authorization_declined
                  occurred_at: '2026-11-26T09:10:00+07:00'
                  data:
                    card_id: crd_01M8867BQMQG52GZYDE75JHF2V
                    merchant_id: mrc_unknown_99
                    reason: wrong_merchant
              transfer_settled_coffee:
                summary: Đối soát chuyển khoản thành công từ sim-world
                value:
                  event_id: evt_01M88H11Y0WR367CGNZZH603T5
                  type: transfer.settled
                  occurred_at: '2026-11-26T08:06:12+07:00'
                  data:
                    rail_txn_id: rtx_01M88H11Y0WR367CGNZZH603T5
                    idempotency_key: pi_01M88557BXGABQA8KPG2382VH5
                    status: settled
                    failure_code: null
      responses:
        '204':
          description: Đã tiếp nhận sự kiện webhook (idempotent theo `event_id`)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    ServiceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
      description: 'Khóa dịch vụ riêng cho từng bên gọi: khóa của `agent-worker` cho các endpoint quản
        lý job/config (kèm `worker_id` + `attempt` trong body), và khóa của `sim-world` cho `/internal/webhooks/rails`.'
    CapabilityBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Capability JWT (EdDSA, claims theo `CapabilityTokenClaims`) do core cấp cho `supervisor`
        hoặc một bot chuyên môn trong đúng một `attempt` của job.
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^job_[0-9A-HJKMNP-TV-Z]{26}$
      example: job_01M882G20CAMSQWE8SVGP02RHD
    ToolId:
      name: tool_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]*$
      example: price_check
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context header (`00-<trace_id>-<span_id>-<flags>`).
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
  headers:
    X-Request-Id:
      description: Mã định danh request để đối chiếu log và truy vết.
      schema:
        type: string
      example: req_01M88INT000000000000000001
  responses:
    BadRequest:
      description: Sai schema hoặc dữ liệu đầu vào không hợp lệ (`400 VALIDATION_FAILED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            validation_failed:
              summary: Dữ liệu vào sai schema
              value:
                type: https://paymatch.dev/problems/validation-failed
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                detail: Input không khớp schema của tool hoặc endpoint.
    Unauthorized:
      description: Thiếu hoặc sai `X-Service-Key` (`401 UNAUTHENTICATED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            invalid_service_key:
              summary: Thiếu hoặc sai X-Service-Key
              value:
                type: https://paymatch.dev/problems/unauthenticated
                title: Authentication required
                status: 401
                code: UNAUTHENTICATED
                detail: Thiếu hoặc không hợp lệ X-Service-Key.
    CapabilityUnauthorized:
      description: Thiếu, sai chữ ký hoặc hết hạn capability token (`401 UNAUTHENTICATED` / `TOKEN_EXPIRED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            token_expired:
              summary: Capability token đã hết hạn 120 s chưa gia hạn qua heartbeat
              value:
                type: https://paymatch.dev/problems/token-expired
                title: Capability token expired
                status: 401
                code: TOKEN_EXPIRED
                detail: Capability token đã hết hạn; cần heartbeat phiên để nhận token mới.
    Forbidden:
      description: Không có quyền gọi endpoint hoặc không khớp bot/job trong token (`403 FORBIDDEN`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            forbidden:
              summary: Không đủ quyền truy cập
              value:
                type: https://paymatch.dev/problems/forbidden
                title: Forbidden
                status: 403
                code: FORBIDDEN
                detail: Khóa dịch vụ hoặc capability token không được phép gọi tài nguyên này.
    ToolNotGranted:
      description: Tool không nằm trong danh sách quyền của capability token (`403 TOOL_NOT_GRANTED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            tool_not_granted:
              summary: Điều phối hoặc bot cố gọi tool không được cấp trong token
              value:
                type: https://paymatch.dev/problems/tool-not-granted
                title: Tool not granted in capability token
                status: 403
                code: TOOL_NOT_GRANTED
                detail: Tool 'inbox' không nằm trong capability token hiện tại.
    NotFound:
      description: Không tìm thấy job (`404 NOT_FOUND`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            job_not_found:
              summary: Không tìm thấy job
              value:
                type: https://paymatch.dev/problems/not-found
                title: Job not found
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy job được yêu cầu.
    LeaseOrStateConflict:
      description: Mất lease `(job_id, attempt, worker_id)` (`409 LEASE_LOST`) hoặc job đã kết thúc (`409
        INVALID_STATE`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            lease_lost:
              summary: Lease đã hết hạn hoặc thuộc attempt/worker khác
              value:
                type: https://paymatch.dev/problems/lease-lost
                title: Job lease lost
                status: 409
                code: LEASE_LOST
                detail: Lease của (job_id, attempt=1, worker_id=agent-worker-01) không còn hiệu lực; dừng
                  xử lý job.
            job_already_completed:
              summary: Job đã kết thúc trước đó
              value:
                type: https://paymatch.dev/problems/invalid-state
                title: Job is not running
                status: 409
                code: INVALID_STATE
                detail: Job đã hoàn tất nên không nhận thêm Finding hoặc hoàn tất lại.
                current_status: completed
    Locked:
      description: Tenant, bot hoặc tool đang bị khóa bởi kill switch (`423 KILL_SWITCH_ACTIVE`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            kill_switch_active:
              summary: Kill switch chặn tool hoặc bot đang gọi
              value:
                type: https://paymatch.dev/problems/kill-switch-active
                title: Kill switch active
                status: 423
                code: KILL_SWITCH_ACTIVE
                detail: Tool hoặc bot hiện tại đang bị tạm dừng bởi kill switch.
    ServiceUnavailable:
      description: Tiến trình chưa sẵn sàng kết nối DB (`503 UPSTREAM_UNAVAILABLE`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem.schema.json
          examples:
            db_unavailable:
              summary: Chưa kết nối được Postgres
              value:
                type: https://paymatch.dev/problems/upstream-unavailable
                title: Database unavailable
                status: 503
                code: UPSTREAM_UNAVAILABLE
                detail: Chưa sẵn sàng kết nối cơ sở dữ liệu.
  schemas:
    HealthResponse:
      title: HealthResponse
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      title: ReadyResponse
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ready
    V1ToolId:
      title: V1ToolId
      description: Danh mục 30 tool chỉ-đọc v1 theo `docs/05-api/internal-api.md §2`.
      type: string
      enum:
      - invoices
      - vendor_contracts
      - price_check
      - price_history
      - purchase_orders
      - goods_receipts
      - payables_ledger
      - three_way_match
      - inbox
      - chat_messages
      - vendor_registry
      - cross_alerts
      - official_fraud_list
      - einvoice_portal
      - tax_id_lookup
      - tax_risk_list
      - utility_bills
      - utility_baseline
      - momo_revenue
      - account_balance
      - spending_limits
      - payment_policy_preview
      - invoice_search
      - invoice_explain
      - spending_summary
      - vendor_stats
      - price_trend
      - queue_status
      - utility_summary
      - payment_history
    ClaimJobRequest:
      title: ClaimJobRequest
      type: object
      additionalProperties: false
      required:
      - worker_id
      properties:
        worker_id:
          type: string
          minLength: 1
        task_types:
          type:
          - array
          - 'null'
          minItems: 1
          items:
            $ref: ../schemas/task-type.schema.json
    ClaimedInvoiceSubject:
      title: ClaimedInvoiceSubject
      type: object
      additionalProperties: false
      required:
      - invoice_id
      properties:
        invoice_id:
          type: string
          pattern: ^inv_[0-9A-HJKMNP-TV-Z]{26}$
    ClaimedQuestionSubject:
      title: ClaimedQuestionSubject
      type: object
      additionalProperties: false
      required:
      - conversation_id
      - message_id
      properties:
        conversation_id:
          type: string
          pattern: ^cnv_[0-9A-HJKMNP-TV-Z]{26}$
        message_id:
          type: string
          pattern: ^cmg_[0-9A-HJKMNP-TV-Z]{26}$
    ClaimedReportSubject:
      title: ClaimedReportSubject
      type: object
      additionalProperties: false
      required:
      - report_id
      properties:
        report_id:
          type: string
          pattern: ^rpt_[0-9A-HJKMNP-TV-Z]{26}$
    ClaimedJobResponse:
      title: ClaimedJobResponse
      type: object
      additionalProperties: false
      required:
      - job_id
      - task_type
      - tenant_id
      - attempt
      - lease_expires_at
