        type:
          type: string
          enum:
          - supervisor.step
          - bot.started
          - bot.tool_called
          - bot.finished
          - bot.failed
          - answer.delta
        step:
          type:
          - integer
          - 'null'
          minimum: 1
        bot_id:
          type:
          - string
          - 'null'
        tool_id:
          type:
          - string
          - 'null'
        severity:
