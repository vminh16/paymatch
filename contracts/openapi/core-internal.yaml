openapi: 3.1.0
info:
  title: PayMatch Core Internal API
  version: 0.1.0
  description: 'Hợp đồng API nội bộ (`/internal/*`, cổng 8003, chỉ mạng service) theo `docs/05-api/internal-api.md`.


    **Hai cơ chế xác thực — KHÔNG BAO GIỜ TRỘN:**

    1. **ServiceKeyAuth (`X-Service-Key`)**: dùng cho các endpoint vòng đời job (`jobs:claim`, `/session`,
    `/heartbeat`, `/progress`, `:complete`, `:fail`, `model-configs` — khóa của `agent-worker`, kèm `worker_id`
    + `attempt` trong body để kiểm tra lease) và `/webhooks/rails` (khóa của `sim-world`).

    2. **CapabilityBearerAuth (`Authorization: Bearer <capability_token>`)**: dùng cho `GET /internal/tools`,
    `POST /internal/tools/{tool_id}:invoke`, `POST /internal/jobs/{job_id}/findings` và `POST /internal/jobs/{job_id}/bot-answers`
    — nhân danh `supervisor` hoặc đúng một bot trong một `attempt`.


    Sai lease `(job_id, attempt, worker_id)` hoặc token của `attempt` cũ → `409 LEASE_LOST`. Tool/bot/tenant
    đang bị ngắt khẩn cấp → `423 KILL_SWITCH_ACTIVE`. Gọi tool ngoài danh sách cấp trong capability token
    → `403 TOOL_NOT_GRANTED`.'
servers:
- url: http://localhost:8003
  description: Local core internal-api server (tiền tố đường dẫn /internal)
tags:
- name: System
  description: Probe kiểm tra tiến trình sống và sẵn sàng
- name: Jobs
  description: Vòng đời job của agent-runtime và nộp Finding / BotAnswer
- name: Config
  description: Cấu hình model chính và dự phòng cho agent-runtime
- name: Tools
  description: Danh mục tool được cấp trong token và thực thi tool chỉ-đọc
- name: Webhooks
  description: Webhook sự kiện hạ tầng thanh toán từ sim-world
paths:
  /internal/healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      tags:
      - System
      security: []
      responses:
        '200':
          description: Tiến trình internal-api đang sống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                alive:
                  summary: Internal API alive
                  value:
                    status: ok
  /internal/readyz:
    get:
      operationId: readyz
      summary: Readiness probe (đã nối DB và phụ thuộc)
      tags:
      - System
      security: []
      responses:
        '200':
          description: Tiến trình internal-api sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Internal API ready
                  value:
                    status: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/jobs:claim:
    post:
      operationId: claimJob
      summary: Nhận một job đang chờ trong hàng đợi (SKIP LOCKED, lease 120 s)
      description: Xác thực bằng `X-Service-Key` của `agent-worker`. Ưu tiên hàng đợi `question` trước
        `investigate_invoice` và `report`; giới hạn đồng thời theo tenant. Trả `200` khi nhận được job
        (`attempt += 1`, lease 120 s) hoặc `204` khi hàng đợi rỗng.
      tags:
      - Jobs
      security:
      - ServiceKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimJobRequest'
            examples:
              worker_all_tasks:
                summary: Worker nhận mọi loại việc
                value:
                  worker_id: agent-worker-01
                  task_types:
                  - question
                  - investigate_invoice
                  - report
      responses:
        '200':
          description: Đã cấp lease cho một job
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimedJobResponse'
              examples:
                claimed_cups_investigation:
                  summary: Nhận job điều tra hóa đơn BRD_03 Cốc nhựa
                  value:
                    job_id: job_01M882G20CAMSQWE8SVGP02RHD
                    task_type: investigate_invoice
                    tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
                    attempt: 1
                    lease_expires_at: '2026-11-26T08:27:03+07:00'
                    subject:
                      invoice_id: inv_01M882P8NTCDKGE2KVFMBTS5RK
                claimed_report_job:
                  summary: Nhận job báo cáo tổng hợp chi tiêu
                  value:
                    job_id: job_01M8805YK9HV0SN8KFN95Y0RPC
                    task_type: report
                    tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
                    attempt: 1
                    lease_expires_at: '2026-11-26T09:02:00+07:00'
                    subject:
                      report_id: rpt_01M885AXP309SER6BAC46N5FJT
        '204':
          description: Không có job nào sẵn sàng trong hàng đợi
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /internal/jobs/{job_id}/session:
    post:
      operationId: openJobSession
      summary: 'Mở phiên chạy job: cấp capability token cho điều phối và từng bot, ngân sách và ngữ cảnh'
      description: Xác thực bằng `X-Service-Key` + `(worker_id, attempt)` khớp lease hiện tại (`409 LEASE_LOST`
        nếu sai). Token điều phối không bao giờ chứa tool trả chữ `untrusted` (`inbox`, `chat_messages`,
        `invoices`). Gọi lại trong cùng `attempt` trả cùng nội dung phiên kèm bộ capability token mới.
      tags:
      - Jobs
      security:
      - ServiceKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenJobSessionRequest'
            examples:
              open_attempt_1:
                summary: Mở phiên cho attempt 1
                value:
                  worker_id: agent-worker-01
                  attempt: 1
      responses:
        '200':
          description: Thông tin phiên chạy, capability token, danh sách bot và ngữ cảnh
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSessionResponse'
              examples:
                investigate_goods_session:
                  summary: Phiên điều tra hóa đơn hàng hóa BRD_03 Cốc nhựa
                  value:
                    budget:
                      seconds: 30
                      max_steps: 12
                    supervisor:
                      capability_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.supervisor.sig
                      token_exp: '2026-11-26T08:27:03+07:00'
                      tools:
                      - tool_id: invoice_explain
                        description: Tra cứu trạng thái, màu và Finding đã lọc chữ của một hóa đơn.
                        input_schema:
                          type: object
                        output_schema:
                          type: object
                        default_provenance: trusted
                        scope: tenant
                    bots:
                    - bot_id: procurement
                      bot_version: 1
                      description: Đối chiếu đơn giá, quy cách đóng gói và hợp đồng khung.
                      manifest:
                        id: procurement
                        name: Thu mua
                        description: Đối chiếu đơn giá, quy cách đóng gói và hợp đồng khung.
                        skills:
                        - procurement_checklist@1
                        tools:
                        - invoices
                        - vendor_contracts
                        - price_check
                        - price_history
                        task_types:
                        - investigate_invoice
                        triggers:
                          invoice_types:
                          - goods
                          - software
                        required_for:
                        - goods
                        - software
                      skills:
                      - skill_id: procurement_checklist
                        version: 1
                        content_md: '# Kiểm tra thu mua

                          ## Khi nào dùng

                          Đối chiếu dòng hàng với hợp đồng khung.'
                      prefetch:
                      - invoices
                      - vendor_contracts
                      capability_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.procurement.sig
                      token_exp: '2026-11-26T08:27:03+07:00'
                    required_bot_ids:
                    - procurement
                    - accounts-payable
                    - fraud-control
                    - tax
                    - treasury
                    skipped: []
                    context:
                      invoice_id: inv_01M882P8NTCDKGE2KVFMBTS5RK
                      invoice_type: goods
                question_session:
                  summary: Phiên hỏi đáp với lịch sử có cấu trúc cho tin assistant (không có chữ tự do)
                  value:
                    budget:
                      seconds: 25
                      max_steps: 8
                    supervisor:
                      capability_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.supervisor_q.sig
                      token_exp: '2026-11-26T09:02:00+07:00'
                      tools:
                      - tool_id: queue_status
                        description: Tổng hợp hàng chờ duyệt hiện tại của tenant.
                        input_schema:
                          type: object
                        output_schema:
                          type: object
                        default_provenance: trusted
                        scope: tenant
                    bots: []
                    required_bot_ids: []
                    skipped: []
                    context:
                      messages:
                      - role: user
                        text_trusted: Hiện có bao nhiêu hóa đơn đang chờ duyệt?
                      - role: assistant
                        message_id: cmg_01M885AXP309SER6BAC46N5FJV
                        citations:
                        - tool_call_id: tcl_01M881AX9X3J7CJVWYPQ6T4168
                          values:
                          - '4'
                          - '66414333'
                      - role: user
                        text_trusted: Trong đó có hóa đơn nào đỏ không?
                      user:
                        role: owner
                        store_ids: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LeaseOrStateConflict'
  /internal/jobs/{job_id}/heartbeat:
    post:
      operationId: heartbeatJob
      summary: Gia hạn lease (mỗi 30 s) và làm mới capability token cho điều phối cùng các bot
      tags:
      - Jobs
      security:
      - ServiceKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobHeartbeatRequest'
            examples:
              heartbeat_attempt_1:
                summary: Heartbeat từ agent-worker-01
                value:
                  worker_id: agent-worker-01
                  attempt: 1
      responses:
        '200':
          description: Đã gia hạn lease và cấp lại capability token mới
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHeartbeatResponse'
              examples:
                renewed_tokens:
                  summary: Lease mới kèm token của supervisor và procurement
                  value:
                    lease_expires_at: '2026-11-26T08:27:33+07:00'
                    tokens:
                    - holder: supervisor
                      capability_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.sup2.sig
                      token_exp: '2026-11-26T08:27:33+07:00'
                    - holder: procurement
                      capability_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.proc2.sig
                      token_exp: '2026-11-26T08:27:33+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LeaseOrStateConflict'
  /internal/jobs/{job_id}/progress:
    post:
      operationId: reportJobProgress
      summary: Gửi lô sự kiện tiến trình chạy của điều phối/bot để phát SSE `/m/jobs/{job_id}/events`
      description: Xác thực bằng `X-Service-Key` + `(worker_id, attempt)`. `answer.delta` chỉ hợp lệ cho
        job `question` (luồng chữ câu trả lời đang sinh, hiển thị như untrusted).
      tags:
      - Jobs
      security:
      - ServiceKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobProgressRequest'
            examples:
              bot_lifecycle_events:
                summary: Tiến trình gọi bot procurement trên BRD_03
                value:
                  worker_id: agent-worker-01
                  attempt: 1
                  events:
                  - type: supervisor.step
                    step: 1
                    at: '2026-11-26T08:25:03+07:00'
                  - type: bot.started
                    bot_id: procurement
                    at: '2026-11-26T08:25:04+07:00'
                  - type: bot.tool_called
                    bot_id: procurement
                    tool_id: price_check
                    at: '2026-11-26T08:25:09+07:00'
                  - type: bot.finished
                    bot_id: procurement
                    severity: yellow
                    at: '2026-11-26T08:25:18+07:00'
      responses:
        '204':
          description: Đã ghi nhận tiến trình
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LeaseOrStateConflict'
  /internal/jobs/{job_id}/findings:
    post:
      operationId: submitFinding
      summary: Bot chuyên môn nộp Finding cho job `investigate_invoice` (dùng capability token của bot)
      description: 'Xác thực bằng `Authorization: Bearer <capability_token>` của đúng bot nộp (`bot_id
        == sub`). Core kiểm tra: mọi `evidence[].tool_call_id` thuộc cùng `(job_id, attempt, bot_id)`,
        `ref_id` đúng mẫu và xuất hiện trong output của `tool_call_id`, đã gọi đủ `prefetch` (miễn
        cho Finding lỗi fail-closed: `reason_codes` chỉ gồm `BOT_TIMEOUT`/`BOT_INVALID_OUTPUT`, `evidence`
        rỗng, core áp sàn vàng), `reason <= 1000` ký tự; sau đó áp mức sàn theo mã lý do + output tool (`internal-api.md §3`) và trả `201
        FindingForSupervisor` (**đã lược bỏ `reason`** để điều phối không bao giờ đọc chữ untrusted).'
      tags:
      - Jobs
      security:
      - CapabilityBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/finding-submission.schema.json
            examples:
              procurement_shrinkflation:
                summary: Bot procurement nộp Finding shrinkflation cho BRD_03 Cốc nhựa
                value:
                  bot_id: procurement
                  bot_version: 1
                  skill_version: 1
                  prompt_hash: sha256:11223344556677889900aabbccddeeff11223344556677889900aabbccddeeff
                  severity_reported: yellow
                  reason_codes:
                  - PACK_SIZE_CHANGED
                  - PRICE_ABOVE_CONTRACT
                  reason: Quy cách đóng gói trên hóa đơn là 800 cái/thùng thay vì 1.000 cái/thùng theo
                    hợp đồng (+21,74%/cái).
                  evidence:
                  - kind: invoice_line
                    ref_id: lin_01M880JA5YPYX80BJYVJNP4YM5
                    tool_call_id: tcl_01M881V688YK0A46F0RNNJENR1
                  - kind: contract_item
                    ref_id: itm_01M88CSDFSBSMNDF8409DYVJBZ
                    tool_call_id: tcl_01M881V688YK0A46F0RNNJENR1
                  provenance: untrusted
                  proposed_channel: null
                  proposed_pay_on: null
      responses:
        '201':
          description: Đã lưu `Finding` và trả `FindingForSupervisor` đã lọc chữ
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: ../schemas/finding-for-supervisor.schema.json
              examples:
                filtered_for_supervisor:
                  summary: Kết quả sạch gửi lại cho điều phối chief-accountant
                  value:
                    finding_id: fnd_01M883PHC7HCEGG0H1PWFRP0RD
                    bot_id: procurement
                    severity: yellow
                    reason_codes:
                    - PACK_SIZE_CHANGED
                    - PRICE_ABOVE_CONTRACT
                    evidence:
                    - kind: invoice_line
                      ref_id: lin_01M880JA5YPYX80BJYVJNP4YM5
                      tool_call_id: tcl_01M881V688YK0A46F0RNNJENR1
                    - kind: contract_item
                      ref_id: itm_01M88CSDFSBSMNDF8409DYVJBZ
                      tool_call_id: tcl_01M881V688YK0A46F0RNNJENR1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/CapabilityUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LeaseOrStateConflict'
        '423':
          $ref: '#/components/responses/Locked'
  /internal/jobs/{job_id}/bot-answers:
    post:
      operationId: submitBotAnswer
      summary: Bot chuyên môn nộp dữ kiện có cấu trúc cho job `question` hoặc `report` (dùng capability
        token của bot)
      description: 'Core kiểm tra `facts[].key` thuộc enum `FactKey` do registry sở hữu và đối chiếu từng
        `facts[].value` với output của `tool_call_id` cùng `(job_id, attempt, bot_id)`. Với `value` kiểu
        số (`number`) kiểm xuất hiện trong output như hiện hành; với `value` kiểu chuỗi (`string`) chỉ chấp
        nhận khi trường nguồn trong output của `tool_call_id` có `provenance = trusted` (gỡ mọi chuỗi từ
        trường/tool `untrusted`), rồi trả `201 BotAnswer`.'
      tags:
      - Jobs
      security:
      - CapabilityBearerAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotAnswerSubmission'
            examples:
              treasury_balance_facts:
                summary: Bot treasury nộp số dư ví và tổng đã tự chi
                value:
                  bot_id: treasury
                  facts:
                  - key: wallet_balance_vnd
                    value: 350000000
                    tool_call_id: tcl_01M883GD8FVTFT81SQ04RGVE4Q
                  reason_codes:
                  - OK
      responses:
        '201':
          description: Đã kiểm chứng dữ kiện và trả `BotAnswer`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: ../schemas/bot-answer.schema.json
              examples:
                verified_bot_answer:
                  summary: Dữ kiện đã được core xác thực từ output tool_call
                  value:
                    bot_id: treasury
                    facts:
                    - key: wallet_balance_vnd
                      value: 350000000
                      tool_call_id: tcl_01M883GD8FVTFT81SQ04RGVE4Q
                      verified: true
                    reason_codes:
                    - OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/CapabilityUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LeaseOrStateConflict'
        '423':
          $ref: '#/components/responses/Locked'
  /internal/jobs/{job_id}:complete:
    post:
      operationId: completeJob
      summary: 'Hoàn tất job: kiểm điều kiện hoàn tất, chạy kiểm tra hệ thống, gộp màu hoặc kiểm trích
        dẫn câu trả lời'
      description: 'Xác thực bằng `X-Service-Key` + `(worker_id, attempt)`.

        - Với `investigate_invoice`: thêm Finding vàng `BOT_NOT_RUN` cho bot bắt buộc chưa nộp Finding,
        `BOT_DISABLED` cho bot bắt buộc trong `skipped`; chạy kiểm tra hệ thống (`internal-api.md §4`);
        gộp màu đơn điệu bằng code; ghi trạng thái hóa đơn bằng CAS từ `investigating`.

        - Với `question` / `report`: kiểm tra mọi con số trong `answer.text` đều xuất hiện trong `citations[].tool_call_id`
        (không khớp → gỡ số và đưa vào `unverified_values`), kiểm `proposed_actions` hợp lệ theo quyền
        người hỏi.'
      tags:
      - Jobs
      security:
      - ServiceKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteJobRequest'
            examples:
              complete_cups_investigation:
                summary: Hoàn tất điều tra BRD_03 kèm tờ trình 5 dòng
                value:
                  worker_id: agent-worker-01
                  attempt: 1
                  result:
                    brief:
                      lines:
                      - Hóa đơn 1C26TNX/00000744 của Bao Bì Nhựa Xanh Việt tổng 22.400.000 đ cần Chủ chuỗi
                        xem xét.
