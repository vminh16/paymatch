              examples:
                held_escrow:
                  summary: Cọc tạm giữ ở trạng thái held
                  value:
                    escrow_id: esc_01M88A6SAP3R27VDQ55VAKCF0P
                    purchase_order_id: po_01M886F6SP0ZHE2X89GQ1TRJSP
                    vendor_account_id: vac_01M883RZCB3B6Y8WG7WQVC1BBY
                    amount_vnd: 8800000
                    status: held
                    source_invoice_id: inv_01M883YAYXMNBVDV7CSN4MH4C4
                    release_invoice_id: null
                    goods_receipt_id: null
                    expires_on: '2026-12-10'
                    created_at: '2026-11-26T09:15:00+07:00'
                    released_at: null
                    refunded_at: null
        '200':
          description: Đã có `Escrow` gắn với `approval_id` này — trả nguyên bản ghi gốc ở mọi trạng thái (idempotent, 1 approval tối đa 1 escrow vĩnh viễn)
          headers:
