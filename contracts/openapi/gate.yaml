openapi: 3.1.0
info:
  title: PayMatch Payment Gate API
  version: 0.1.0
  description: |
    Hợp đồng API Payment Gate (`/gate/*`, cổng 8100, chỉ mạng service) theo `docs/05-api/gate-api.md`
    và `docs/02-architecture/payment-gate.md`.

    **Ranh giới tin cậy:**
    - Payment Gate là tiến trình duy nhất ghi `ledger` và gọi `/sim/rails/*`.
    - Mọi endpoint nghiệp vụ bắt buộc `X-Service-Key` riêng cho từng bên gọi (`merchant-api`, `core-worker`,
      `internal-api`, `console-api`); gọi endpoint ngoài ma trận quyền của bên gọi trả `403 FORBIDDEN`.
      `agent-worker` không bao giờ có khóa Gate.
    - Riêng probe sống/sẵn sàng `GET /gate/healthz` và `GET /gate/readyz` không yêu cầu khóa (`security: []`).
    - Gate **không tin dữ liệu số tiền hay tài khoản trong request**: request chỉ truyền ID; Gate tự đọc
      `core`, `control`, `risk` (chỉ-đọc) để suy ra tenant (lệch `tenant_id` → `403 TENANT_MISMATCH`),
      kiểm tra 3 lớp luật (luật cứng, policy nền tảng + kill switch, mandate) và tự tính lại `intent_hash`
      theo RFC 8785 + SHA-256 (`docs/05-api/schemas.md §4`).

servers:
  - url: http://localhost:8100
    description: Local payment-gate server (tiền tố đường dẫn /gate)

security:
  - ServiceKeyAuth: []

tags:
  - name: System
    description: Probe kiểm tra tiến trình sống và sẵn sàng
  - name: Evaluate
    description: Đánh giá thử điều kiện chi và chọn kênh thanh toán không tác dụng phụ
  - name: Budgets
    description: Tra cứu ngân sách tự chi và tổng chi theo ngày của tenant
  - name: Intents
    description: Quản lý vòng đời PaymentIntent hai pha (authorized → executing → settled/failed/expired/denied)
  - name: Escrows
    description: Quản lý cọc tạm giữ gắn đơn đặt hàng PO cho nhà cung cấp mới (F7)

paths:
  /gate/healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      tags: [System]
      security: []
      responses:
        '200':
          description: Tiến trình gate đang sống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                alive:
                  summary: Gate alive
                  value:
                    status: ok

  /gate/readyz:
    get:
      operationId: readyz
      summary: Readiness probe (đã nối DB ledger/core/control/risk)
      tags: [System]
      security: []
      responses:
        '200':
          description: Tiến trình gate sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Gate ready
                  value:
                    status: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /gate/evaluate:
    post:
      operationId: evaluatePaymentPolicy
      x-allowed-callers:
        - merchant-api
        - core-worker
        - internal-api
      summary: Đánh giá thử 3 lớp luật và chọn kênh thanh toán (không tác dụng phụ)
      description: |
        Bên gọi được phép: `merchant-api` (approval-preview, escrow-preview), `core-worker` (kiểm tự chi F2),
        `internal-api` (tool `payment_policy_preview`).
        - Đánh giá hóa đơn: truyền `{invoice_id, tenant_id?}`.
        - Đánh giá cọc tạm giữ (F7): truyền `{purchase_order_id, vendor_account_id, amount_vnd, tenant_id?}`.
        - Kênh do Gate tự chọn: hóa đơn có PO đang có escrow `held` → `escrow`; ngược lại theo `mandate.channel_rules`,
          mặc định `bank_transfer`.
        - Luật cứng: số tiền ≤ 0 (hóa đơn điều chỉnh giảm, chiết khấu, hóa đơn 0 đ) luôn `DENY` với
          `GateReason.code = NON_POSITIVE_AMOUNT`; áp cho intent hóa đơn, tạo cọc và giải ngân.
      tags: [Evaluate]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
            examples:
              evaluate_invoice_cups:
                summary: Đánh giá hóa đơn BRD_03 Cốc nhựa (vàng)
                value:
                  invoice_id: inv_01M882P8NTCDKGE2KVFMBTS5RK
              evaluate_invoice_coffee_autopay:
                summary: Đánh giá hóa đơn BRD_01 Cà phê hạt (xanh, đủ điều kiện tự chi)
                value:
                  invoice_id: inv_01M8808XXD8017SJ9NTGTNC48Y
                  tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
              evaluate_escrow_po:
                summary: Xem trước tạo cọc tạm giữ gắn PO (F7)
                value:
                  purchase_order_id: po_01M886F6SP0ZHE2X89GQ1TRJSP
                  vendor_account_id: vac_01M883RZCB3B6Y8WG7WQVC1BBY
                  amount_vnd: 8800000
      responses:
        '200':
          description: Kết quả đánh giá `ALLOW` | `REQUIRE_APPROVAL` | `DENY` kèm `intent_hash` và `reasons`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
              examples:
                allow_coffee_autopay:
                  summary: BRD_01 Cà phê hạt 26,5tr — ALLOW theo mandate tự chi
                  value:
                    decision: ALLOW
                    allowed_methods:
                      - single
                      - bulk
                    verification_required: false
                    intent_hash: 900cc2e7b79b8ac1fe213fbc5a603e5e93ca803cbd2a3cd9547653e7e2d0e48f
                    payee_account_id: vac_01M885170DEVTBBKXKDK90DBAS
                    amount_vnd: 26500000
                    channel: bank_transfer
                    reasons: []
                    evaluated_at: '2026-11-26T08:06:00+07:00'
                require_approval_cups:
                  summary: BRD_03 Cốc nhựa 22,4tr — REQUIRE_APPROVAL (single)
                  value:
                    decision: REQUIRE_APPROVAL
                    allowed_methods:
                      - single
                    verification_required: false
                    intent_hash: 7fe62bf514d7be8158c45f4f9a8c0c070629d068c55b20d4a3ae4a20fc2327fb
                    payee_account_id: vac_01M883RZCB3B6Y8WG7WQVC1BBY
                    amount_vnd: 22400000
                    channel: bank_transfer
                    reasons:
                      - code: VENDOR_NOT_IN_AUTO_PAY
                        layer: mandate
                        detail: Hóa đơn có cảnh báo vàng (PACK_SIZE_CHANGED, PRICE_ABOVE_CONTRACT) và NCC không thuộc danh sách tự chi.
                    evaluated_at: '2026-11-26T08:30:00+07:00'
                deny_syrup_blocked:
                  summary: BRD_04 Si-rô NCC mới (đỏ) — DENY, payee_account_id = null
                  value:
                    decision: DENY
                    allowed_methods: []
                    verification_required: false
                    intent_hash: 814d5db7aed90fb642a1e0c67e3df005fd5e3b6d34662a8238479d2cf9e85f7d
                    payee_account_id: null
                    amount_vnd: 8800000
                    channel: bank_transfer
                    reasons:
                      - code: BLOCKED_INVOICE
                        layer: hard_rule
                        detail: Hóa đơn đang ở trạng thái blocked (mức đỏ) nên không bao giờ được chi trực tiếp.
                      - code: PAYEE_NOT_VERIFIED
                        layer: hard_rule
                        detail: Người bán (MST 0999090001) chưa có tài khoản đã xác minh trong vendor registry.
                    evaluated_at: '2026-11-26T08:40:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /gate/budgets/{tenant_id}/{date}:
    get:
      operationId: getDailyBudget
      x-allowed-callers:
        - core-worker
        - internal-api
      summary: Đọc ngân sách tự chi và tổng chi trong ngày của tenant
      description: |
        Bên gọi được phép: `core-worker`, `internal-api` (tool `spending_limits`).
        `auto_pay_limit_vnd` = `min(mandate.limits.per_day_vnd, platform_limits.auto_pay_per_day_vnd)`.
      tags: [Budgets]
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'
          example: ten_01M88D3C06B97Y4G0S9W8BVKNG
        - name: date
          in: path
          required: true
          schema:
            $ref: '../schemas/local-date.schema.json'
          example: '2026-11-26'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Trạng thái ngân sách ngày của tenant
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBudgetResponse'
              examples:
                morning_after_coffee_and_pos:
                  summary: Chuỗi Lá Xanh sáng 26/11 sau khi tự chi cà phê 26,5tr và phần mềm 12tr
                  value:
                    date: '2026-11-26'
                    auto_pay_used_vnd: 38500000
                    auto_pay_reserved_vnd: 0
                    auto_pay_limit_vnd: 50000000
                    total_paid_vnd: 38500000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gate/intents:
    post:
      operationId: createPaymentIntent
      x-allowed-callers:
        - core-worker
      summary: Tạo PaymentIntent pha 1 (authorized, giữ chỗ ngân sách ngày)
      description: |
        Bên gọi được phép: **chỉ `core-worker`**.
        - Gate tự đọc hóa đơn, approval (`status = active`, `job_id` = job hoàn tất mới nhất, `intent_hash` khớp,
          `channel != escrow`), danh bạ NCC, mandate hiện hành và kill switch/policy.
        - Đã tồn tại intent ở `authorized` / `executing` / `settled` cho cùng hóa đơn → trả `200` với intent đó (idempotent).
        - Bị từ chối → lưu intent ở trạng thái `denied` để truy vết, phát `payment.denied` vào `ledger.outbox`,
          và trả `422 GATE_DENIED` kèm `gate_reasons[]` và `payment_intent`.
      tags: [Intents]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
            examples:
              authorize_cups_payment:
                summary: Tạo PaymentIntent cho hóa đơn BRD_03 sau khi Chủ chuỗi duyệt
                value:
                  invoice_id: inv_01M882P8NTCDKGE2KVFMBTS5RK
                  approval_id: apv_01M883BRJ9DP97B91S0CMK8PZJ
      responses:
        '201':
          description: Đã tạo `PaymentIntent` mới ở trạng thái `authorized`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '../schemas/payment-intent.schema.json'
              examples:
                authorized_cups:
                  summary: Intent của BRD_03 ở trạng thái authorized
                  value:
                    payment_intent_id: pi_01M8867BQMQG52GZYDE75JHF2V
                    tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
                    invoice_id: inv_01M882P8NTCDKGE2KVFMBTS5RK
                    purchase_order_id: null
                    intent_hash: 7fe62bf514d7be8158c45f4f9a8c0c070629d068c55b20d4a3ae4a20fc2327fb
                    approval_id: apv_01M883BRJ9DP97B91S0CMK8PZJ
                    payee_account_id: vac_01M883RZCB3B6Y8WG7WQVC1BBY
                    channel: bank_transfer
                    amount_vnd: 22400000
                    status: authorized
                    gate_reasons: []
                    rail:
                      rail_txn_id: null
                      failure_code: null
                    transfer_memo: '0999010003 · 1C26TNX · 00000744'
                    authorized_at: '2026-11-26T08:32:00+07:00'
                    executed_at: null
                    settled_at: null
                    expires_at: '2026-11-26T08:47:00+07:00'
                    created_at: '2026-11-26T08:32:00+07:00'
        '200':
          description: Đã có `PaymentIntent` đang mở/đã tất toán cho hóa đơn này (idempotent)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '../schemas/payment-intent.schema.json'
              examples:
                existing_settled_coffee:
                  summary: Hóa đơn BRD_01 đã có intent settled
                  value:
                    payment_intent_id: pi_01M88557BXGABQA8KPG2382VH5
                    tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
                    invoice_id: inv_01M8808XXD8017SJ9NTGTNC48Y
                    purchase_order_id: null
                    intent_hash: 900cc2e7b79b8ac1fe213fbc5a603e5e93ca803cbd2a3cd9547653e7e2d0e48f
                    approval_id: apv_01M885AXP309SER6BAC46N5FJT
                    payee_account_id: vac_01M885170DEVTBBKXKDK90DBAS
                    channel: bank_transfer
                    amount_vnd: 26500000
                    status: settled
                    gate_reasons: []
                    rail:
                      rail_txn_id: rtx_01M88H11Y0WR367CGNZZH603T5
                      failure_code: null
                    transfer_memo: '0999010001 · 1C26TTN · 00001425'
                    authorized_at: '2026-11-26T08:06:05+07:00'
                    executed_at: '2026-11-26T08:06:08+07:00'
                    settled_at: '2026-11-26T08:06:12+07:00'
                    expires_at: '2026-11-26T08:21:05+07:00'
                    created_at: '2026-11-26T08:06:05+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IntentGateDenied'
        '423':
          $ref: '#/components/responses/Locked'

    get:
      operationId: listPaymentIntents
      x-allowed-callers:
        - merchant-api
        - core-worker
      summary: Danh sách PaymentIntent phân trang theo tenant
      description: |
        Bên gọi được phép: `merchant-api`, `core-worker`.
        Bắt buộc truyền `tenant_id`; Gate kiểm quyền bên gọi và chỉ trả các intent thuộc `tenant_id` đó.
      tags: [Intents]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'
          example: ten_01M88D3C06B97Y4G0S9W8BVKNG
        - name: invoice_id
          in: query
          required: false
          schema:
            type: string
            pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '../schemas/payment-intent-status.schema.json'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Trang danh sách `PaymentIntent`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentPage'
              examples:
                settled_intents:
                  summary: Hai lệnh tự chi đã settled buổi sáng 26/11
                  value:
                    items:
                      - payment_intent_id: pi_01M88557BXGABQA8KPG2382VH5
                        tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
                        invoice_id: inv_01M8808XXD8017SJ9NTGTNC48Y
                        purchase_order_id: null
                        intent_hash: 900cc2e7b79b8ac1fe213fbc5a603e5e93ca803cbd2a3cd9547653e7e2d0e48f
                        approval_id: apv_01M885AXP309SER6BAC46N5FJT
                        payee_account_id: vac_01M885170DEVTBBKXKDK90DBAS
                        channel: bank_transfer
                        amount_vnd: 26500000
                        status: settled
                        gate_reasons: []
                        rail:
                          rail_txn_id: rtx_01M88H11Y0WR367CGNZZH603T5
                          failure_code: null
                        transfer_memo: '0999010001 · 1C26TTN · 00001425'
                        authorized_at: '2026-11-26T08:06:05+07:00'
                        executed_at: '2026-11-26T08:06:08+07:00'
                        settled_at: '2026-11-26T08:06:12+07:00'
                        expires_at: '2026-11-26T08:21:05+07:00'
                        created_at: '2026-11-26T08:06:05+07:00'
                    next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /gate/intents/{payment_intent_id}:
    get:
      operationId: getPaymentIntent
      x-allowed-callers:
        - merchant-api
        - core-worker
        - console-api
      summary: Chi tiết một PaymentIntent
      description: |
        Bên gọi được phép: `merchant-api`, `core-worker`, và `console-api` (bắt buộc kèm `X-Ticket-Id` từ handler tra bằng chứng F6).
      tags: [Intents]
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - name: X-Ticket-Id
          in: header
          required: false
          description: Bắt buộc khi người gọi là `console-api` (thiếu → `403 TICKET_REQUIRED`).
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Chi tiết `PaymentIntent`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '../schemas/payment-intent.schema.json'
              examples:
                settled_coffee:
                  summary: Intent settled của BRD_01
                  value:
                    payment_intent_id: pi_01M88557BXGABQA8KPG2382VH5
                    tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
                    invoice_id: inv_01M8808XXD8017SJ9NTGTNC48Y
                    purchase_order_id: null
                    intent_hash: 900cc2e7b79b8ac1fe213fbc5a603e5e93ca803cbd2a3cd9547653e7e2d0e48f
                    approval_id: apv_01M885AXP309SER6BAC46N5FJT
                    payee_account_id: vac_01M885170DEVTBBKXKDK90DBAS
                    channel: bank_transfer
                    amount_vnd: 26500000
                    status: settled
                    gate_reasons: []
                    rail:
                      rail_txn_id: rtx_01M88H11Y0WR367CGNZZH603T5
                      failure_code: null
                    transfer_memo: '0999010001 · 1C26TTN · 00001425'
                    authorized_at: '2026-11-26T08:06:05+07:00'
                    executed_at: '2026-11-26T08:06:08+07:00'
                    settled_at: '2026-11-26T08:06:12+07:00'
                    expires_at: '2026-11-26T08:21:05+07:00'
                    created_at: '2026-11-26T08:06:05+07:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /gate/intents/{payment_intent_id}:execute:
    post:
      operationId: executePaymentIntent
      x-allowed-callers:
        - core-worker
      summary: Thực thi PaymentIntent pha 2 (đánh giá lại toàn bộ rồi gọi rail)
      description: |
        Bên gọi được phép: **chỉ `core-worker`**.
        - Ngay trước khi gọi `/sim/rails/*`, Gate đánh giá lại toàn bộ từ DB (cảnh báo chéo mới, hard block,
          kill switch, trạng thái hóa đơn, approval còn `active`). Trượt → chuyển intent sang `denied`,
          phát `payment.denied`, trả `422 GATE_DENIED`.
        - Nếu intent đang ở `executing` → trả trạng thái hiện tại, không gọi rail lần hai.
        - Nếu rail timeout sau 5 s → intent giữ `executing`, trả `200` với `status = executing` (vòng nền của Gate sẽ đối chiếu).
      tags: [Intents]
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutePaymentIntentRequest'
            examples:
              execute_default:
                summary: Gọi thực thi pha 2
                value: {}
      responses:
        '200':
          description: Kết quả thực thi (`settled` | `failed` | `executing`)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '../schemas/payment-intent.schema.json'
              examples:
                settled_cups:
                  summary: Chuyển khoản thành công trên rail
                  value:
                    payment_intent_id: pi_01M8867BQMQG52GZYDE75JHF2V
                    tenant_id: ten_01M88D3C06B97Y4G0S9W8BVKNG
                    invoice_id: inv_01M882P8NTCDKGE2KVFMBTS5RK
                    purchase_order_id: null
