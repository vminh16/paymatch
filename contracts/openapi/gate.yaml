  /gate/intents/{payment_intent_id}:cancel:
    post:
      operationId: cancelPaymentIntent
      x-allowed-callers:
        - core-worker
      summary: Hủy PaymentIntent đang ở trạng thái authorized và hoàn chỗ ngân sách ngày
      description: |
        Bên gọi được phép: **chỉ `core-worker`**.
        Chỉ hợp lệ khi intent đang ở `authorized` (chuyển sang `expired` và phát `payment.expired`);
        nếu đang ở `executing` hoặc đã kết thúc → `409 INVALID_STATE`.
      tags: [Intents]
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/Traceparent'
