  /gate/escrows/{escrow_id}:release:
    post:
      operationId: releaseEscrow
      x-allowed-callers:
        - core-worker
      summary: Giải ngân cọc tạm giữ khi đủ phiếu nhập hàng và hóa đơn giải ngân đã duyệt (F7)
      description: |
        Bên gọi được phép: **chỉ `core-worker`**.
        Gate tự đọc lại toàn bộ từ DB và kiểm tra:
        - `goods_receipt_id` thuộc đúng PO của cọc;
        - `approval_id` là bản ghi `active` của job điều tra hoàn tất mới nhất với `channel = escrow` và `intent_hash` khớp bản hiện tại của hóa đơn giải ngân;
        - hóa đơn giải ngân cùng NCC, gắn PO, không `blocked`;
        - **số tiền đã duyệt (`approval.amount_vnd`) PHẢI BẰNG đúng số tiền cọc đang giữ (`escrow.amount_vnd`) VÀ tài khoản nhận đã duyệt (`approval.payee_account_id`) PHẢI BẰNG đúng tài khoản của cọc (`escrow.vendor_account_id`)**;
        - đánh giá lại toàn bộ policy trước khi giải ngân (kill switch → `423 KILL_SWITCH_ACTIVE`, `risk.hard_blocks`, `risk.cross_alerts` chưa xác minh gọi lại, SIMO).
        - Sai lệch số tiền / tài khoản / PO / phiếu nhập / hóa đơn so với cọc → `422 GATE_DENIED` với `GateReason.code = ESCROW_MISMATCH`.
      tags: [Escrows]
      parameters:
        - $ref: '#/components/parameters/EscrowId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseEscrowRequest'
            examples:
              release_with_grn:
                summary: Giải ngân cọc khi đã có GRN và approval hóa đơn giao hàng
                value:
                  approval_id: apv_01M883BRJ9DP97B91S0CMK8PZJ
                  goods_receipt_id: grn_01M88AR4Z4F0HA2R6KPFXBFX7S
      responses:
        '200':
          description: Đã giải ngân cọc (`released`)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '../schemas/escrow.schema.json'
              examples:
                released_escrow:
                  summary: Cọc đã giải ngân cho NCC
                  value:
                    escrow_id: esc_01M88A6SAP3R27VDQ55VAKCF0P
                    purchase_order_id: po_01M886F6SP0ZHE2X89GQ1TRJSP
                    vendor_account_id: vac_01M883RZCB3B6Y8WG7WQVC1BBY
                    amount_vnd: 8800000
                    status: released
                    source_invoice_id: inv_01M883YAYXMNBVDV7CSN4MH4C4
                    release_invoice_id: inv_01M883YAYXMNBVDV7CSN4MH4C4
                    goods_receipt_id: grn_01M88AR4Z4F0HA2R6KPFXBFX7S
                    expires_on: '2026-12-10'
                    created_at: '2026-11-26T09:15:00+07:00'
                    released_at: '2026-11-28T14:20:00+07:00'
                    refunded_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
