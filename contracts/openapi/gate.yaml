components:
  securitySchemes:
    ServiceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Khóa dịch vụ riêng cho từng bên gọi (`merchant-api`, `core-worker`, `internal-api`, `console-api`).

  parameters:
    PaymentIntentId:
      name: payment_intent_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^pi_[0-9A-HJKMNP-TV-Z]{26}$'
      example: pi_01M88557BXGABQA8KPG2382VH5
    EscrowId:
      name: escrow_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^esc_[0-9A-HJKMNP-TV-Z]{26}$'
      example: esc_01M88A6SAP3R27VDQ55VAKCF0P
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context header (`00-<trace_id>-<span_id>-<flags>`).
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    Limit:
      name: limit
      in: query
      description: Số bản ghi tối đa trên một trang (mặc định 50, tối đa 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Con trỏ phân trang lấy từ `next_cursor` của trang trước.
      schema:
        type: string

  headers:
    X-Request-Id:
      description: Mã định danh request để đối chiếu log và truy vết.
      schema:
        type: string
      example: req_01M88GATE00000000000000001

  responses:
    BadRequest:
      description: Sai schema hoặc dữ liệu đầu vào không hợp lệ (`400 VALIDATION_FAILED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            validation_failed:
              summary: Lỗi dữ liệu đầu vào
              value:
                type: https://paymatch.dev/problems/validation-failed
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                detail: Dữ liệu đầu vào không hợp lệ.
    Unauthorized:
      description: Thiếu hoặc sai khóa `X-Service-Key` (`401 UNAUTHENTICATED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            unauthenticated:
              summary: Thiếu hoặc sai X-Service-Key
              value:
                type: https://paymatch.dev/problems/unauthenticated
                title: Authentication required
                status: 401
                code: UNAUTHENTICATED
                detail: Thiếu hoặc không hợp lệ X-Service-Key.
    Forbidden:
      description: Bên gọi không được phép gọi endpoint này (`403 FORBIDDEN`), thiếu `X-Ticket-Id` (`TICKET_REQUIRED`), hoặc lệch tenant (`TENANT_MISMATCH`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            caller_forbidden:
              summary: Bên gọi ngoài ma trận quyền của Gate
              value:
                type: https://paymatch.dev/problems/forbidden
                title: Caller not permitted for endpoint
                status: 403
                code: FORBIDDEN
                detail: Khóa dịch vụ hiện tại không có quyền gọi endpoint này trên Payment Gate.
            tenant_mismatch:
              summary: tenant_id trong request không khớp với hóa đơn/PO trong DB
              value:
                type: https://paymatch.dev/problems/tenant-mismatch
                title: Tenant mismatch
                status: 403
                code: TENANT_MISMATCH
                detail: tenant_id truyền vào khác với tenant sở hữu hóa đơn/PO.
    NotFound:
      description: Không tìm thấy tài nguyên (`404 NOT_FOUND`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            not_found:
              summary: Không tìm thấy PaymentIntent hoặc Escrow
              value:
                type: https://paymatch.dev/problems/not-found
                title: Resource not found
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy bản ghi được yêu cầu.
    Conflict:
      description: Hành động không hợp lệ ở trạng thái hiện tại (`409 INVALID_STATE`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            cannot_cancel_executing:
              summary: Không thể hủy intent đang executing
              value:
                type: https://paymatch.dev/problems/invalid-state
                title: Invalid intent state
                status: 409
                code: INVALID_STATE
                detail: Không thể hủy PaymentIntent khi đang ở trạng thái executing.
