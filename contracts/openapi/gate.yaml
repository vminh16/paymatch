  /gate/escrows:
    post:
      operationId: createEscrow
      x-allowed-callers:
        - merchant-api
      summary: Tạo khoản cọc tạm giữ từ Approval của Chủ chuỗi (F7)
      description: |
        Bên gọi được phép: **chỉ `merchant-api`**.
        - Gate tự đọc PO, TK nhận (`verified` hoặc `escrow_only` thuộc NCC của PO), số tiền (`<= PO.total_vnd`)
          và `source_invoice_id` từ bản ghi `Approval`. Mỗi PO tối đa một escrow đang mở (`pending`/`held`).
        - **Một `approval_id` chỉ cấp vốn cho tối đa một escrow vĩnh viễn** (`UNIQUE (approval_id)` ánh xạ
          `approval_id → escrow_id`). Gọi lại `POST /gate/escrows` với cùng `approval_id` trả `200` kèm bản ghi
          `Escrow` gốc ở **mọi trạng thái** (`pending`/`held`/`released`/`refunded`/`failed`), không tạo cọc mới.
        - Sau khi cọc hết hạn/hoàn (`refunded`) hoặc thất bại (`failed`), tạo cọc mới bắt buộc phải có `approval_id` mới.
      tags: [Escrows]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEscrowRequest'
            examples:
              create_syrup_escrow:
                summary: Tạo cọc 8,8tr cho đơn hàng PO si-rô (F7)
                value:
                  approval_id: apv_01M883BRJ9DP97B91S0CMK8PZJ
                  expires_on: '2026-12-10'
      responses:
        '201':
          description: Đã tạo `Escrow` mới ở trạng thái `held` (hoặc `pending` nếu rail chưa phản hồi sau 5 s)
          headers:
            X-Request-Id:
