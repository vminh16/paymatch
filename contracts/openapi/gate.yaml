  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready

    GateDecision:
      title: GateDecision
      type: string
      enum:
        - ALLOW
        - REQUIRE_APPROVAL
        - DENY

    PaymentIntentStateMachineStatus:
      $ref: '../schemas/payment-intent-status.schema.json'

    EscrowStateMachineStatus:
      $ref: '../schemas/escrow-status.schema.json'

    EvaluateInvoiceRequest:
      title: EvaluateInvoiceRequest
      type: object
      additionalProperties: false
      required: [invoice_id]
      properties:
        invoice_id:
          type: string
          pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    EvaluateEscrowRequest:
      title: EvaluateEscrowRequest
      type: object
      additionalProperties: false
      required: [purchase_order_id, vendor_account_id, amount_vnd]
      properties:
        purchase_order_id:
          type: string
          pattern: '^po_[0-9A-HJKMNP-TV-Z]{26}$'
        vendor_account_id:
          type: string
          pattern: '^vac_[0-9A-HJKMNP-TV-Z]{26}$'
        amount_vnd:
          $ref: '../schemas/money-vnd.schema.json'
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    EvaluateRequest:
      title: EvaluateRequest
      oneOf:
        - $ref: '#/components/schemas/EvaluateInvoiceRequest'
        - $ref: '#/components/schemas/EvaluateEscrowRequest'

    EvaluateResponse:
      title: EvaluateResponse
      type: object
      additionalProperties: false
      required:
        - decision
        - allowed_methods
        - verification_required
        - intent_hash
        - payee_account_id
        - amount_vnd
        - channel
        - reasons
        - evaluated_at
      properties:
        decision:
          $ref: '#/components/schemas/GateDecision'
        allowed_methods:
          type: array
          items:
            type: string
            enum: [single, bulk]
        verification_required:
          type: boolean
        intent_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payee_account_id:
          type: [string, 'null']
          pattern: '^vac_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Null chỉ khi `decision = DENY` và người bán chưa có tài khoản trong vendor registry.
        amount_vnd:
          $ref: '../schemas/money-vnd.schema.json'
        channel:
          $ref: '../schemas/channel.schema.json'
        reasons:
          type: array
          description: >
            Danh sách mã lý do của Payment Gate (`BLOCKED_INVOICE`, `PAYEE_NOT_VERIFIED`,
            `ABOVE_PER_INVOICE_LIMIT`, `ABOVE_DAILY_LIMIT`, `CROSS_ALERT_UNVERIFIED`,
            `OFFICIAL_FRAUD_LIST`, `KILL_SWITCH`, `POLICY_UNAVAILABLE`, `CHANNEL_NOT_ALLOWED`,
            `ALREADY_PAID`, `OUTSIDE_TIME_WINDOW`, `MANDATE_NOT_AUTO_PAY`,
            `VENDOR_NOT_IN_AUTO_PAY`, `VENDOR_SUSPENDED`, `APPROVAL_MISSING`, `APPROVAL_STALE`,
            `ESCROW_MISMATCH`).
          items:
            $ref: '../schemas/gate-reason.schema.json'
        evaluated_at:
          $ref: '../schemas/timestamp.schema.json'
      if:
        properties:
          decision:
            enum: [ALLOW, REQUIRE_APPROVAL]
        required: [decision]
      then:
        properties:
          payee_account_id:
            type: string
            pattern: '^vac_[0-9A-HJKMNP-TV-Z]{26}$'

    DailyBudgetResponse:
      title: DailyBudgetResponse
      type: object
      additionalProperties: false
      required:
        - date
        - auto_pay_used_vnd
        - auto_pay_reserved_vnd
        - auto_pay_limit_vnd
        - total_paid_vnd
      properties:
        date:
          $ref: '../schemas/local-date.schema.json'
        auto_pay_used_vnd:
          $ref: '../schemas/money-vnd.schema.json'
        auto_pay_reserved_vnd:
          $ref: '../schemas/money-vnd.schema.json'
        auto_pay_limit_vnd:
          $ref: '../schemas/money-vnd.schema.json'
        total_paid_vnd:
          $ref: '../schemas/money-vnd.schema.json'

    CreatePaymentIntentRequest:
      title: CreatePaymentIntentRequest
      type: object
      additionalProperties: false
      required: [invoice_id, approval_id]
      properties:
        invoice_id:
          type: string
          pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
        approval_id:
          type: string
          pattern: '^apv_[0-9A-HJKMNP-TV-Z]{26}$'
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    ExecutePaymentIntentRequest:
      title: ExecutePaymentIntentRequest
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    CancelPaymentIntentReason:
      title: CancelPaymentIntentReason
      type: string
      enum:
        - CROSS_ALERT
        - INVOICE_REINVESTIGATED
        - OWNER_CANCELLED

    CancelPaymentIntentRequest:
      title: CancelPaymentIntentRequest
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/CancelPaymentIntentReason'
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    PaymentIntentPage:
      title: PaymentIntentPage
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '../schemas/payment-intent.schema.json'
        next_cursor:
          type: [string, 'null']

    CreateEscrowRequest:
      title: CreateEscrowRequest
      type: object
      additionalProperties: false
      required: [approval_id, expires_on]
      properties:
        approval_id:
          type: string
          pattern: '^apv_[0-9A-HJKMNP-TV-Z]{26}$'
        expires_on:
          $ref: '../schemas/local-date.schema.json'
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    ReleaseEscrowRequest:
      title: ReleaseEscrowRequest
      type: object
      additionalProperties: false
      required: [approval_id, goods_receipt_id]
      properties:
        approval_id:
          type: string
          pattern: '^apv_[0-9A-HJKMNP-TV-Z]{26}$'
        goods_receipt_id:
          type: string
          pattern: '^grn_[0-9A-HJKMNP-TV-Z]{26}$'
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    RefundEscrowReason:
      title: RefundEscrowReason
      type: string
      enum:
        - EXPIRED
        - ORDER_CANCELLED

    RefundEscrowRequest:
      title: RefundEscrowRequest
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/RefundEscrowReason'
        tenant_id:
          type: [string, 'null']
          pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'

    GateDeniedProblem:
      title: GateDeniedProblem
      description: RFC 9457 Problem Details cho lỗi `422 GATE_DENIED`, kèm `gate_reasons[]` bắt buộc và `payment_intent` trạng thái `denied` (nếu có).
      type: object
      additionalProperties: false
      required: [type, title, status, code, gate_reasons]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          const: 422
        code:
          type: string
          const: GATE_DENIED
        detail:
          type: string
        instance:
          type: string
        gate_reasons:
          type: array
          minItems: 1
          items:
            $ref: '../schemas/gate-reason.schema.json'
        payment_intent:
          anyOf:
            - $ref: '../schemas/payment-intent.schema.json'
            - type: 'null'

    IntentGateDeniedProblem:
      title: IntentGateDeniedProblem
      description: RFC 9457 Problem Details cho lỗi `422 GATE_DENIED` trên thao tác PaymentIntent, bắt buộc kèm `gate_reasons[]` và `payment_intent` ở trạng thái `denied`.
      type: object
      additionalProperties: false
      required: [type, title, status, code, gate_reasons, payment_intent]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          const: 422
        code:
          type: string
          const: GATE_DENIED
        detail:
          type: string
        instance:
          type: string
        gate_reasons:
          type: array
          minItems: 1
          items:
            $ref: '../schemas/gate-reason.schema.json'
        payment_intent:
          allOf:
            - $ref: '../schemas/payment-intent.schema.json'
            - type: object
              properties:
                status:
                  type: string
                  const: denied
