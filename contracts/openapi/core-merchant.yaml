openapi: 3.1.0
info:
  title: PayMatch Merchant API
  version: 0.1.0
  description: |
    Hợp đồng API Merchant (`/m/*`, cổng 8001) cho lát cắt dọc demo (vertical slice v0.1.0).

    **Lưu ý phạm vi (v0.1.0):** File này mới chỉ khai báo 16 endpoint thuộc lát cắt demo
    (phiên đăng nhập, danh sách/chi tiết hóa đơn, tải lên hóa đơn, kết quả điều tra, xem trước duyệt,
    duyệt/từ chối hóa đơn, mẫu yêu cầu điều chỉnh, tiến trình job & SSE, hàng chờ duyệt, thông báo, reset demo).
    Các nhóm `/m/*` còn lại trong `docs/05-api/merchant-api.md` (hỏi đáp/báo cáo, duyệt hàng loạt,
    mandate, nhà cung cấp & xác minh đổi TK, chứng từ PO/GRN/escrow, bot/skill tự tạo, lịch chi/trả ngay/hủy chi)
    chưa nằm trong bản hợp đồng này.

    **Quy ước chung:** JSON `snake_case`, tiền VND là `integer` (`_vnd`), số thập phân dạng chuỗi (`Decimal`),
    thời gian RFC 3339 có múi giờ VN (`+07:00`), lỗi chuẩn RFC 9457 (`application/problem+json`) kèm `code`.
    Mọi `POST` có tác dụng phụ bắt buộc header `Idempotency-Key` (≤ 64 ký tự).
    Trường nằm trong `UntrustedText` hoặc `Invoice.untrusted` phải được frontend escape, không render HTML/Markdown.

servers:
  - url: http://localhost:8001
    description: Local merchant-api hoặc Prism mock server (tiền tố đường dẫn /m)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Phiên làm việc merchant và thông tin người dùng hiện tại
  - name: Invoices
    description: Tiếp nhận, tra cứu, đối soát, duyệt và từ chối hóa đơn
  - name: Jobs
    description: Tiến trình chạy agent-runtime và luồng SSE
  - name: Queue
    description: Hàng chờ duyệt hóa đơn cần chú ý
  - name: Notifications
    description: Thông báo merchant
  - name: Demo
    description: Điều khiển trạng thái demo (chỉ bật khi DEMO_MODE=true)

