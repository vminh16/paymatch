  /m/invoices:
    get:
      operationId: listInvoices
      summary: Danh sách hóa đơn phân trang có bộ lọc
      description: |
        Vai được phép — `owner`, `accountant`, `store_manager`.
        `store_manager` chỉ thấy hóa đơn có `store_id` thuộc quán được gán (không thấy hóa đơn `store_id = null`).
        Nhiều giá trị cho cùng bộ lọc lặp lại tham số query (`?status=blocked&status=pending_approval`).
      tags: [Invoices]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: status
          in: query
          description: Lọc theo trạng thái hóa đơn (lặp tham số để chọn nhiều giá trị).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '../schemas/invoice-status.schema.json'
        - name: severity
          in: query
          description: Lọc theo mức độ (xanh/vàng/đỏ).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '../schemas/severity.schema.json'
        - name: vendor_id
          in: query
          schema:
            type: string
            pattern: '^ven_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: store_id
          in: query
          schema:
            type: string
            pattern: '^sto_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: reason_code
          in: query
          description: Lọc theo mã lý do (lặp tham số để chọn nhiều giá trị).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '../schemas/reason-code.schema.json'
        - name: invoice_type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '../schemas/invoice-type.schema.json'
        - name: issued_from
          in: query
          schema:
            $ref: '../schemas/local-date.schema.json'
        - name: issued_to
          in: query
          schema:
            $ref: '../schemas/local-date.schema.json'
        - name: q
          in: query
          description: Tìm theo ký hiệu hoặc số hóa đơn.
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
