  /m/demo:reset:
    post:
      operationId: resetDemo
      summary: Đặt lại dữ liệu demo về trạng thái ban đầu (chỉ DEMO_MODE=true)
      description: |
        Vai được phép — **chỉ `owner`**, chỉ khả dụng khi `DEMO_MODE=true` (ngoài demo endpoint này không được mount và trả `404`).
        Bắt buộc `Idempotency-Key`.
        Xóa dữ liệu tenant demo, nạp lại `core_seed` và gọi `POST /sim/scenario:reset`.
      tags: [Demo]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoResetRequest'
            examples:
              empty_body:
                summary: Đặt lại bộ dữ liệu demo mặc định
                value: {}
      responses:
        '200':
          description: Đã đặt lại trạng thái demo thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResetResponse'
              examples:
                demo_reset_ok:
                  summary: Kết quả nạp lại dữ liệu demo
                  value:
                    reset_at: '2026-11-26T08:00:00+07:00'
                    counts:
                      tenants: 2
                      stores: 19
                      vendors: 52
                      scenarios: 49
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session JWT do `POST /m/auth/session` cấp.

  parameters:
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
      example: inv_01M882P8NTCDKGE2KVFMBTS5RK
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
      example: job_01M882G20CAMSQWE8SVGP02RHD
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống trùng lặp cho mọi POST có tác dụng phụ (tối đa 64 ký tự, lưu 24 giờ).
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: idem-20261126-cups-approve-001
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context header (`00-<trace_id>-<span_id>-<flags>`).
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: ID sự kiện SSE cuối cùng đã nhận (`evt_...`) để phát lại trong cửa sổ 10 phút.
      schema:
        type: string
        pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
    Limit:
      name: limit
      in: query
      description: Số bản ghi tối đa trên một trang (mặc định 50, tối đa 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Con trỏ phân trang lấy từ `next_cursor` của trang trước.
      schema:
        type: string

  headers:
    X-Request-Id:
      description: Mã định danh request để đối chiếu log và truy vết.
      schema:
        type: string
      example: req_01M88DEMO00000000000000001
    ETag:
      description: Phiên bản tài nguyên dùng với `If-Match` khi cập nhật.
      schema:
        type: string
      example: '"inv_01M882P8NTCDKGE2KVFMBTS5RK:v2"'
    Retry-After:
      description: Số giây cần chờ trước khi thử lại khi bị giới hạn tần suất (429).
      schema:
        type: integer
        minimum: 1
      example: 5

  responses:
    BadRequest:
      description: Sai schema hoặc dữ liệu đầu vào không hợp lệ (`400 VALIDATION_FAILED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            validation_failed:
              summary: Lỗi kiểm tra dữ liệu vào
              value:
                type: https://paymatch.dev/problems/validation-failed
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                detail: Dữ liệu đầu vào không hợp lệ.
                errors:
                  - field: limit
                    code: out_of_range
    Unauthorized:
      description: Thiếu, sai hoặc hết hạn token xác thực (`401 UNAUTHENTICATED` / `TOKEN_EXPIRED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            unauthenticated:
              summary: Thiếu hoặc sai Bearer token
              value:
                type: https://paymatch.dev/problems/unauthenticated
                title: Authentication required
                status: 401
                code: UNAUTHENTICATED
                detail: Thiếu hoặc không hợp lệ Authorization Bearer token.
    Forbidden:
      description: Không có quyền thực hiện hành động (`403 FORBIDDEN` / `ROLE_NOT_ALLOWED` / `STEP_UP_REQUIRED` / `STEP_UP_INVALID`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            role_not_allowed:
              summary: Vai trò không được phép
              value:
                type: https://paymatch.dev/problems/role-not-allowed
                title: Role not allowed
                status: 403
                code: ROLE_NOT_ALLOWED
                detail: Tài khoản hiện tại không có quyền thực hiện thao tác này.
    NotFound:
      description: Không tìm thấy tài nguyên hoặc tài nguyên thuộc tenant khác (`404 NOT_FOUND`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            not_found:
              summary: Không tìm thấy
              value:
                type: https://paymatch.dev/problems/not-found
                title: Resource not found
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy tài nguyên được yêu cầu.
    Conflict:
      description: Xung đột trạng thái hoặc tái sử dụng `Idempotency-Key` (`409 INVALID_STATE` / `IDEMPOTENCY_KEY_REUSED`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            invalid_state:
              summary: Trạng thái hiện tại không cho phép thao tác
              value:
                type: https://paymatch.dev/problems/invalid-state
                title: Invalid resource state
                status: 409
                code: INVALID_STATE
                detail: Không thể thực hiện hành động ở trạng thái hiện tại của hóa đơn.
                current_status: paid
    Locked:
      description: Bị kill switch chặn (`423 KILL_SWITCH_ACTIVE`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            kill_switch_active:
              summary: Kill switch đang kích hoạt
              value:
                type: https://paymatch.dev/problems/kill-switch-active
                title: Kill switch active
                status: 423
                code: KILL_SWITCH_ACTIVE
                detail: Hệ thống đang tạm khóa thao tác duyệt/chi do kill switch đang kích hoạt.
    TooManyRequests:
      description: Vượt giới hạn tần suất (`429 RATE_LIMITED`)
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            rate_limited:
              summary: Quá nhiều yêu cầu
              value:
                type: https://paymatch.dev/problems/rate-limited
                title: Rate limit exceeded
                status: 429
                code: RATE_LIMITED
                detail: Vượt giới hạn tần suất gọi API, vui lòng thử lại sau.
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc (Payment Gate / sim-world) không phản hồi (`503 UPSTREAM_UNAVAILABLE`)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/problem.schema.json'
          examples:
            gate_unavailable:
              summary: Payment Gate không phản hồi
              value:
                type: https://paymatch.dev/problems/upstream-unavailable
                title: Upstream service unavailable
                status: 503
                code: UPSTREAM_UNAVAILABLE
                detail: Không kết nối được Payment Gate để xem trước điều kiện chi; nút Duyệt tạm khóa.

  schemas:
    AuthSessionRequest:
      type: object
      additionalProperties: false
      required: [momo_token]
      properties:
        momo_token:
          type: string
          minLength: 1

    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [session_jwt, expires_at, user]
      properties:
        session_jwt:
          type: string
        expires_at:
          $ref: '../schemas/timestamp.schema.json'
        user:
          $ref: '../schemas/user.schema.json'

    MeResponse:
      type: object
      additionalProperties: false
      required: [user_id, name, role, store_ids, tenant, permissions]
      properties:
        user_id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
        name:
          type: string
        role:
          type: string
          enum: [owner, accountant, store_manager]
        store_ids:
          type: array
          items:
            type: string
            pattern: '^sto_[0-9A-HJKMNP-TV-Z]{26}$'
        tenant:
          type: object
          additionalProperties: false
          required: [tenant_id, name]
          properties:
            tenant_id:
              type: string
              pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'
            name:
              type: string
        permissions:
          type: array
          items:
            type: string

    InvoicePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '../schemas/invoice-summary.schema.json'
        next_cursor:
          type: [string, 'null']

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '../schemas/notification.schema.json'
        next_cursor:
          type: [string, 'null']

    InvoiceUploadResponse:
      type: object
      additionalProperties: false
      required: [invoice_id, job_id, status]
      properties:
        invoice_id:
          type: string
          pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
        job_id:
          type: [string, 'null']
          pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
        status:
          $ref: '../schemas/invoice-status.schema.json'

    ApproveInvoiceRequest:
      type: object
      additionalProperties: false
      required: [intent_hash, job_id, auth_proof]
      properties:
        intent_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        job_id:
          type: string
          pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
        auth_proof:
          type: string
          minLength: 1
          description: Step-up JWT một lần gắn đúng `action_hash`.
        verification:
          anyOf:
            - $ref: '../schemas/verification.schema.json'
            - type: 'null'

    ApproveInvoiceResponse:
      type: object
      additionalProperties: false
      required: [approval, invoice]
      properties:
        approval:
          $ref: '../schemas/approval.schema.json'
        invoice:
          $ref: '../schemas/invoice-summary.schema.json'

    RejectInvoiceRequest:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code:
          type: string
          enum:
            - PRICE_ABOVE_CONTRACT
            - PACK_SIZE_CHANGED
            - QUANTITY_ABOVE_NORM
            - NO_GOODS_RECEIPT
            - DUPLICATE_INVOICE
            - OTHER
        note:
          type: [string, 'null']
          maxLength: 1000

    RejectInvoiceResponse:
      type: object
      additionalProperties: false
      required: [invoice, adjustment_request]
      properties:
        invoice:
          $ref: '../schemas/invoice-summary.schema.json'
        adjustment_request:
          anyOf:
            - $ref: '../schemas/adjustment-request.schema.json'
            - type: 'null'

    ApprovalQueueGroup:
      type: object
      additionalProperties: false
      required: [key, label, count, total_vnd, bulk_approvable_count, invoices]
      properties:
        key:
          type: string
        label:
          type: string
          description: Tên NCC từ vendor registry hoặc tên mã lý do chuẩn (trusted).
        count:
          type: integer
          minimum: 0
        total_vnd:
          $ref: '../schemas/signed-money-vnd.schema.json'
        bulk_approvable_count:
          type: integer
          minimum: 0
        invoices:
          type: array
          items:
            $ref: '../schemas/invoice-summary.schema.json'

    ApprovalQueueResponse:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalQueueGroup'

    DemoResetRequest:
      type: object
      additionalProperties: false

    DemoResetResponse:
      type: object
      additionalProperties: false
      required: [reset_at, counts]
      properties:
        reset_at:
          $ref: '../schemas/timestamp.schema.json'
        counts:
          type: object
          additionalProperties:
            type: integer

    JobSseEventData:
      description: Cấu trúc payload `data` cho các sự kiện SSE trên `GET /m/jobs/{job_id}/events` (docs/05-api/events.md §3).
      oneOf:
        - title: SupervisorStepEventData
          type: object
          additionalProperties: false
          required: [job_id, step, at]
          properties:
            job_id:
              type: string
              pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
            step:
              type: integer
              minimum: 1
            at:
              $ref: '../schemas/timestamp.schema.json'
        - title: BotStartedEventData
          type: object
          additionalProperties: false
          required: [job_id, bot_id, at]
          properties:
            job_id:
              type: string
              pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
            bot_id:
              type: string
            at:
              $ref: '../schemas/timestamp.schema.json'
        - title: BotToolCalledEventData
          type: object
          additionalProperties: false
          required: [job_id, bot_id, tool_id, at]
          properties:
            job_id:
              type: string
              pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
            bot_id:
              type: string
            tool_id:
              type: string
            at:
              $ref: '../schemas/timestamp.schema.json'
        - title: BotFinishedEventData
          type: object
          additionalProperties: false
          required: [job_id, bot_id, severity, at]
          properties:
            job_id:
              type: string
              pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
            bot_id:
              type: string
            severity:
              $ref: '../schemas/severity.schema.json'
            at:
              $ref: '../schemas/timestamp.schema.json'
        - title: BotFailedEventData
          type: object
          additionalProperties: false
          required: [job_id, bot_id, reason_code, at]
          properties:
            job_id:
              type: string
              pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
            bot_id:
              type: string
            reason_code:
              $ref: '../schemas/reason-code.schema.json'
            at:
              $ref: '../schemas/timestamp.schema.json'
        - title: AnswerDeltaEventData
          type: object
          additionalProperties: false
          required: [job_id, text_delta, at]
          properties:
            job_id:
              type: string
              pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
            text_delta:
              type: string
              description: Chuỗi streaming từ LLM (hiển thị như untrusted).
            at:
              $ref: '../schemas/timestamp.schema.json'
        - title: JobCompletedEventData
          type: object
          additionalProperties: false
          required: [job_id, task_type, at]
          properties:
            job_id:
              type: string
              pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
            task_type:
              $ref: '../schemas/task-type.schema.json'
            invoice_id:
              type: [string, 'null']
              pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
            final_severity:
              anyOf:
                - $ref: '../schemas/severity.schema.json'
                - type: 'null'
            reason_codes:
              type: array
              items:
                $ref: '../schemas/reason-code.schema.json'
            at:
              $ref: '../schemas/timestamp.schema.json'
        - title: ResyncEventData
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason:
              type: string
              const: cursor_expired

    TenantSseEventData:
      description: Cấu trúc payload `data` cho các sự kiện SSE trên `GET /m/events` (docs/05-api/events.md §3).
      oneOf:
        - title: InvoiceStatusChangedEventData
          type: object
          additionalProperties: false
          required: [invoice_id, from, to, severity]
          properties:
            invoice_id:
              type: string
              pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
            from:
              $ref: '../schemas/invoice-status.schema.json'
            to:
              $ref: '../schemas/invoice-status.schema.json'
            severity:
              anyOf:
                - $ref: '../schemas/severity.schema.json'
                - type: 'null'
        - title: NotificationCreatedEventData
          type: object
          additionalProperties: false
          required: [notification_id, kind]
          properties:
            notification_id:
              type: string
              pattern: '^ntf_[0-9A-HJKMNP-TV-Z]{26}$'
            kind:
              $ref: '../schemas/notification-kind.schema.json'
        - title: PaymentUpdatedEventData
          type: object
          additionalProperties: false
          required: [invoice_id, payment_intent_id, status]
          properties:
            invoice_id:
              type: string
              pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
            payment_intent_id:
              type: string
              pattern: '^pi_[0-9A-HJKMNP-TV-Z]{26}$'
            status:
              $ref: '../schemas/payment-intent-status.schema.json'
        - title: TenantResyncEventData
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason:
              type: string
              const: cursor_expired
