      summary: Luồng SSE mức tenant cho hàng chờ duyệt và thanh toán tự cập nhật
      description: |
        Vai được phép — `owner`, `accountant`, `store_manager` (S chỉ nhận sự kiện của hóa đơn thuộc quán mình).
        Kết nối mở liên tục, server gửi `: keep-alive` mỗi 15 giây.
        Hỗ trợ `Last-Event-ID` trong 10 phút; quá hạn gửi `event: resync`.

        **Danh mục sự kiện (theo `docs/05-api/events.md §3`):**
        - `invoice.status_changed`: `{"invoice_id", "from", "to", "severity"}`
        - `notification.created`: `{"notification_id", "kind"}`
        - `payment.updated`: `{"invoice_id", "payment_intent_id", "status"}` (gộp mọi `payment.*`)
        - `resync`: `{"reason": "cursor_expired"}`
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/LastEventId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Luồng Server-Sent Events (`text/event-stream`) mức tenant
          headers:
            X-Request-Id:
