  /m/notifications:
    get:
      operationId: listNotifications
      summary: Danh sách thông báo merchant
      description: |
        Vai được phép — `owner`, `accountant`, `store_manager`.
        `title` và `body` sinh từ mẫu cố định trong code theo `kind`, không chèn chữ untrusted.
      tags: [Notifications]
      parameters:
        - name: unread
          in: query
          description: Chỉ trả các thông báo chưa đọc (`read_at = null`).
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Trang danh sách `Notification`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              examples:
                demo_notifications:
                  summary: Thông báo mẫu cho Chủ chuỗi Lá Xanh
                  value:
                    items:
                      - notification_id: ntf_01M882CX6Y9ZHBRXEWV1T2WJ2T
