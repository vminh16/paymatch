  /m/jobs/{job_id}/events:
    get:
      operationId: streamJobEvents
      summary: Luồng SSE tiến trình chạy của một job
      description: |
        Vai được phép — `owner`, `accountant`.
        Xác thực qua header `Authorization: Bearer <session_jwt>` (frontend dùng `@microsoft/fetch-event-source`, không truyền token qua query string).
        Hỗ trợ `Last-Event-ID` để phát lại sự kiện trong 10 phút; quá hạn server gửi `event: resync`.
        Đóng luồng sau sự kiện `job.completed`.

        **Danh mục sự kiện (theo `docs/05-api/events.md §3`):**
        - `supervisor.step`: `{"job_id", "step", "at"}`
        - `bot.started`: `{"job_id", "bot_id", "at"}`
        - `bot.tool_called`: `{"job_id", "bot_id", "tool_id", "at"}`
        - `bot.finished`: `{"job_id", "bot_id", "severity", "at"}`
        - `bot.failed`: `{"job_id", "bot_id", "reason_code", "at"}`
        - `answer.delta`: `{"job_id", "text_delta", "at"}` (chỉ dùng cho hỏi đáp `question`; hiển thị như untrusted và thay bằng bản đã kiểm khi `job.completed`)
        - `job.completed`: `{"job_id", "task_type", "invoice_id", "final_severity", "reason_codes", "at"}`
        - `resync`: `{"reason": "cursor_expired"}` (client tải lại bằng REST `GET /m/jobs/{job_id}`)

        Trừ `answer.delta`, SSE chỉ mang id, trạng thái, màu, mã lý do — không mang chữ `untrusted`.
      tags: [Jobs]
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/LastEventId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Luồng Server-Sent Events (`text/event-stream`), đóng sau `job.completed`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Khung SSE chuẩn gồm các dòng `event:`, `id:` (`evt_...`), `data:` (JSON theo schema `JobSseEventData`).
              examples:
                cups_investigation_stream:
                  summary: Chuỗi sự kiện điều tra BRD_03 Cốc nhựa (kết thúc ở job.completed)
                  value: |
                    event: bot.started
                    id: evt_01M882K8BY0KFHR1A2K3JJ2VAW
                    data: {"job_id":"job_01M882G20CAMSQWE8SVGP02RHD","bot_id":"procurement","at":"2026-11-26T08:25:04+07:00"}

                    event: bot.tool_called
                    id: evt_01M883BB1FXJC4G3TW65RGP86A
                    data: {"job_id":"job_01M882G20CAMSQWE8SVGP02RHD","bot_id":"procurement","tool_id":"price_check","at":"2026-11-26T08:25:09+07:00"}

                    event: bot.finished
                    id: evt_01M887PSZPEFG02RYZ4V72XBG1
                    data: {"job_id":"job_01M882G20CAMSQWE8SVGP02RHD","bot_id":"procurement","severity":"yellow","at":"2026-11-26T08:25:18+07:00"}

                    event: job.completed
                    id: evt_01M8832YSWRQKE66NHG99GV63G
                    data: {"job_id":"job_01M882G20CAMSQWE8SVGP02RHD","task_type":"investigate_invoice","invoice_id":"inv_01M882P8NTCDKGE2KVFMBTS5RK","final_severity":"yellow","reason_codes":["PACK_SIZE_CHANGED","PRICE_ABOVE_CONTRACT"],"at":"2026-11-26T08:25:42+07:00"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /m/events:
