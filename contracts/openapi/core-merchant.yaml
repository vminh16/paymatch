  /m/auth/session:
    post:
      operationId: createAuthSession
      summary: Đổi momo_token lấy phiên JWT merchant
      description: |
        Không yêu cầu Bearer token. Core kiểm tra `momo_token` bằng JWKS của bên định danh
        (demo: `GET /sim/identity/.well-known/jwks.json`) rồi cấp `session_jwt` gắn `tenant_id`, `role`, `store_ids`.
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionRequest'
            examples:
              owner_lan:
                summary: Chủ chuỗi Lá Xanh (Nguyễn Thị Lan)
                value:
                  momo_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfMDFNODg1QVhQMzA5U0VSNkJBQzQ2TjVGSlQiLCJ0ZW5hbnRfaWQiOiJ0ZW5fMDFNODhEM0MwNkI5N1k0RzBTOVc4QlZLTkciLCJyb2xlIjoib3duZXIifQ.demo-signature
      responses:
        '200':
          description: Tạo phiên thành công
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              examples:
                owner_lan:
                  summary: Phiên của Chủ chuỗi Nguyễn Thị Lan
