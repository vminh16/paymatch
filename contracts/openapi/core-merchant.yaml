  /m/invoices:upload:
    post:
      operationId: uploadInvoice
      summary: Tải lên hóa đơn (XML, PDF, ảnh)
      description: |
        Vai được phép — `owner`, `accountant`. Bắt buộc `Idempotency-Key`.
        - Kiểm idempotency theo `(tenant_id, sha256)`: cùng file đã nạp → no-op trả `200` với hóa đơn đã có.
        - File khác `sha256` trùng khóa `(seller_tax_id, symbol, int(number))` → `409 DUPLICATE_INVOICE` kèm `existing_invoice_id`, không lưu.
        - XML không parse được → `422 XML_UNPARSEABLE`, không lưu.
        - PDF/ảnh → lưu, gắn `NON_XML_SOURCE`, số tiền null cho tới khi nhập tay.
        - XML hợp lệ mới → tạo hóa đơn (`investigating`) và job (`queued`) trong cùng transaction, trả `202`.
      tags: [Invoices]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File hóa đơn gốc (XML HĐĐT QĐ 1233, PDF hoặc ảnh).
                message_text:
                  type: string
                  maxLength: 4000
                  description: Ghi chú/nội dung email đi kèm (tùy chọn, được gắn nhãn untrusted).
      responses:
        '202':
          description: Đã tiếp nhận hóa đơn và xếp hàng job điều tra
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceUploadResponse'
              examples:
                accepted_xml:
                  summary: Hóa đơn XML mới được xếp hàng điều tra
                  value:
                    invoice_id: inv_01M8846Y1BNH3A5MWHBT18JZFR
                    job_id: job_01M8805YK9HV0SN8KFN95Y0RPC
                    status: investigating
        '200':
          description: File trùng đúng `sha256` đã nạp trước đó (no-op, không tạo bản ghi mới)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceUploadResponse'
              examples:
                identical_sha256_noop:
                  summary: Upload lại cùng file 1C26TTN_00001425.xml
                  value:
                    invoice_id: inv_01M8808XXD8017SJ9NTGTNC48Y
                    job_id: job_01M884YAJ1PQC6EA2VHS71SXY2
                    status: paid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Hóa đơn trùng khóa (file khác sha256) hoặc tái dùng `Idempotency-Key` với payload khác
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/problem.schema.json'
              examples:
                duplicate_invoice:
                  summary: File khác sha256 trùng (0999010001, 1C26TTN, 1425)
                  value:
                    type: https://paymatch.dev/problems/duplicate-invoice
                    title: Duplicate invoice detected
                    status: 409
                    code: DUPLICATE_INVOICE
                    detail: Hóa đơn (MST 0999010001, ký hiệu 1C26TTN, số 1425) đã tồn tại với nội dung file khác.
                    instance: /m/invoices:upload
                    existing_invoice_id: inv_01M8808XXD8017SJ9NTGTNC48Y
                idempotency_reused:
                  summary: Idempotency-Key dùng lại với body khác
                  value:
                    type: https://paymatch.dev/problems/idempotency-key-reused
                    title: Idempotency key reused with different payload
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: Idempotency-Key đã được dùng cho một yêu cầu khác trong 24 giờ qua.
                    instance: /m/invoices:upload
        '422':
          description: XML không parse được hoặc không dùng đơn vị VND
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/problem.schema.json'
              examples:
                xml_unparseable:
                  summary: File XML lỗi cấu trúc
                  value:
                    type: https://paymatch.dev/problems/xml-unparseable
                    title: Invoice XML could not be parsed
                    status: 422
                    code: XML_UNPARSEABLE
                    detail: Không đọc được cấu trúc HĐĐT theo QĐ 1233/QĐ-CT hoặc thiếu thẻ bắt buộc TTChung/NDHDon.
                    instance: /m/invoices:upload

  /m/invoices/{invoice_id}:
    get:
