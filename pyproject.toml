[project]
name = "paymatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.103.0",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8",
    "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "packages"]
