[project]
name = "sim-world"
version = "0.1.0"
description = "Giả lập thế giới bên ngoài (chỉ demo/test)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_world"]
