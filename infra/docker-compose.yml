# Thêm service vào đây khi từng service có Dockerfile.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paymatch
      POSTGRES_USER: paymatch
      POSTGRES_PASSWORD: paymatch   # chỉ dùng cho local/demo
    ports: ["5432:5432"]

  sim-world:
    build:
      context: ..
      dockerfile: services/sim-world/Dockerfile
    environment:
      SIM_PORT: "8200"
      SIM_DATASET: demo
      SIM_SEED: "42"
      DEMO_MODE: "true"
      SIM_CORE_SERVICE_KEY: ${SIM_CORE_SERVICE_KEY:-dev-core-key}   # chỉ dùng cho local/demo
      SIM_GATE_SERVICE_KEY: ${SIM_GATE_SERVICE_KEY:-dev-gate-key}   # chỉ dùng cho local/demo
      CORE_INTERNAL_URL: ${CORE_INTERNAL_URL:-}
      SIM_WEBHOOK_SERVICE_KEY: ${SIM_WEBHOOK_SERVICE_KEY:-dev-sim-webhook-key}
    ports: ["8200:8200"]

  gate:
    build:
      context: ..
      dockerfile: services/payment-gate/Dockerfile
    depends_on:
      - postgres
      - sim-world
    environment:
      GATE_PORT: "8100"
      DATABASE_URL: ${DATABASE_URL:-postgresql://paymatch:paymatch@postgres:5432/paymatch}
      SIM_URL: ${SIM_URL:-http://sim-world:8200/sim}
      SIM_GATE_SERVICE_KEY: ${SIM_GATE_SERVICE_KEY:-dev-gate-key}
      DEMO_MODE: ${DEMO_MODE:-true}
      GATE_MERCHANT_API_KEY: ${GATE_MERCHANT_API_KEY:-dev-gate-merchant-key}
      GATE_CORE_WORKER_KEY: ${GATE_CORE_WORKER_KEY:-dev-gate-worker-key}
      GATE_INTERNAL_API_KEY: ${GATE_INTERNAL_API_KEY:-dev-gate-internal-key}
      GATE_CONSOLE_API_KEY: ${GATE_CONSOLE_API_KEY:-dev-gate-console-key}
    ports: ["8100:8100"]
